<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- renderer は同一オリジンのバンドル1本とインラインスタイルのみ。外部リソース・
         eval・リモート接続は許可しない（第10章10.1節・Electron セキュリティ既定）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <title>TECSCDE</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f3f3f3;
        --border: #cccccc;
        --ink: #222222;
        --accent: #1f6feb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      #toolbar button {
        font: inherit;
        padding: 3px 8px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 3px;
        cursor: pointer;
      }
      #toolbar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #toolbar .sep {
        width: 1px;
        align-self: stretch;
        background: var(--border);
        margin: 0 2px;
      }
      #toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      #search-box {
        position: relative;
      }
      #search-input {
        font: inherit;
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: 3px;
        width: 180px;
      }
      #search-count {
        color: #666666;
        min-width: 3em;
      }
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #palette {
        flex: none;
        width: 160px;
        overflow-y: auto;
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 8px;
      }
      #palette-mode {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      #palette-mode button,
      .palette-celltype {
        font: inherit;
        padding: 3px 6px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 3px;
        cursor: pointer;
        text-align: left;
      }
      #palette-mode button.active,
      .palette-celltype.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      #palette-celltypes {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .palette-empty {
        color: #888888;
        font-size: 11px;
      }
      #canvas-area {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      #canvas-scroll {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #fafafa;
      }
      #canvas {
        display: block;
      }
      #navigator {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 140px;
        height: 100px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 3px;
      }
      #navigator svg {
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .navigator-paper {
        fill: #ffffff;
        stroke: #999999;
        stroke-width: 2;
      }
      .navigator-viewport {
        fill: rgba(31, 111, 235, 0.15);
        stroke: var(--accent);
        stroke-width: 2;
      }
      #property-panel {
        flex: none;
        width: 200px;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--border);
        padding: 8px;
      }
      #property-panel h3 {
        margin: 0 0 8px;
        font-size: 12px;
      }
      .prop-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 6px;
      }
      .prop-field label {
        font-size: 10px;
        color: #666666;
      }
      .prop-field input {
        font: inherit;
        padding: 2px 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
      }
      .prop-field input:read-only {
        background: #eeeeee;
        color: #666666;
      }
      .prop-note,
      .prop-readonly {
        color: #888888;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .prop-readonly-note {
        color: #b45309;
        font-size: 11px;
        margin-bottom: 6px;
      }
      #search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        max-height: 200px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid var(--border);
        z-index: 1;
      }
      #search-results:empty {
        display: none;
      }
      .search-hit {
        padding: 3px 8px;
        font-size: 11px;
        cursor: pointer;
      }
      .search-hit:hover {
        background: #eeeeee;
      }
      .search-hit.current {
        background: var(--accent);
        color: #fff;
      }
      .search-hit.revealed {
        font-style: italic;
      }
      #statusbar {
        position: relative;
        display: flex;
        gap: 16px;
        padding: 3px 10px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      #status-diag {
        font: inherit;
        color: #b45309;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
      }
      #status-diag:disabled {
        cursor: default;
      }
      #status-file {
        margin-left: auto;
      }
      #diagnostics-panel {
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        max-height: 240px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid var(--border);
        border-bottom: none;
        z-index: 1;
      }
      .diag-item {
        padding: 4px 10px;
        font-size: 11px;
        border-bottom: 1px solid var(--border);
      }
      .diag-error {
        color: #b91c1c;
      }
      .diag-warning {
        color: #b45309;
      }
      .diag-jumpable {
        cursor: pointer;
      }
      .diag-jumpable:hover {
        background: #eeeeee;
      }

      /* --- SvgRenderer / CellRenderer / JoinRenderer が出すクラス --- */
      .cell-rect {
        fill: #ffffff;
        stroke: #333333;
        stroke-width: 1;
      }
      .cell-rect.readonly {
        fill: #f0f0f0;
        stroke: #999999;
      }
      .cell-rect.unresolved {
        stroke: #d29922;
        stroke-dasharray: 3 2;
      }
      .cell-label {
        font-size: 11px;
        fill: #111111;
      }
      .celltype-label {
        font-size: 9px;
        fill: #666666;
      }
      .port-symbol {
        stroke: #333333;
        stroke-width: 0.75;
      }
      .port-symbol-cport {
        fill: #ffffff;
      }
      .port-symbol-eport {
        fill: #333333;
      }
      .join-line {
        stroke: #444444;
        stroke-width: 1.25;
      }
      .signature-label {
        font-size: 9px;
        fill: #555555;
      }
      .grid-line {
        stroke: #e2e2e2;
        stroke-width: 0.5;
      }
      .selection-outline {
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-dasharray: 4 2;
      }
      .selection-outline.join-selected {
        stroke-width: 2.5;
      }
      .join-preview {
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-dasharray: 5 3;
      }
      .rubber-band {
        stroke: var(--accent);
        stroke-width: 1;
        stroke-dasharray: 3 2;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button data-action="open" type="button">開く</button>
        <button data-action="save" type="button">保存</button>
        <button data-action="saveAs" type="button">名前を付けて保存</button>
        <span class="sep"></span>
        <button data-action="undo" type="button">元に戻す</button>
        <button data-action="redo" type="button">やり直し</button>
        <span class="sep"></span>
        <button data-action="zoomOut" type="button">−</button>
        <button data-action="zoomReset" type="button">100%</button>
        <button data-action="zoomIn" type="button">＋</button>
        <button data-action="toggleGrid" type="button">グリッド</button>
        <button data-action="toggleNavigator" type="button">ナビゲータ</button>
        <span class="sep"></span>
        <button data-action="generate" type="button" title="tecsgenを実行する（第9章9.5節）">実行</button>
        <button data-action="copyTecsgenCommand" type="button" title="tecsgenのコマンドラインをコピーする（外部仕様8.4.2）">コマンドをコピー</button>
        <span class="sep"></span>
        <div id="search-box">
          <input type="search" id="search-input" placeholder="検索: セル名/セルタイプ/シグニチャ" />
          <span id="search-count"></span>
          <button data-action="searchPrev" type="button" title="前のヒットへ">↑</button>
          <button data-action="searchNext" type="button" title="次のヒットへ">↓</button>
          <div id="search-results"></div>
        </div>
      </div>
      <div id="main">
        <div id="palette">
          <div id="palette-mode">
            <button data-mode="select" type="button">選択</button>
            <button data-mode="newCell" type="button">セル新規作成</button>
          </div>
          <div id="palette-celltypes"></div>
        </div>
        <div id="canvas-area">
          <div id="canvas-scroll">
            <svg id="canvas" xmlns="http://www.w3.org/2000/svg" width="0" height="0"></svg>
          </div>
          <div id="navigator">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"></svg>
          </div>
        </div>
        <div id="property-panel"></div>
      </div>
      <div id="statusbar">
        <span id="status-pos"></span>
        <span id="status-zoom"></span>
        <button id="status-diag" type="button" title="診断一覧を表示/非表示"></button>
        <div id="diagnostics-panel" hidden></div>
        <span id="status-file"></span>
      </div>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
