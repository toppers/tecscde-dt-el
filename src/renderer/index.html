<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- renderer は同一オリジンのバンドル1本とインラインスタイルのみ。外部リソース・
         eval・リモート接続は許可しない（第10章10.1節・Electron セキュリティ既定）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'"
    />
    <title>TECSCDE</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f3f3f3;
        --border: #cccccc;
        --ink: #222222;
        --accent: #1f6feb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      #toolbar button {
        font: inherit;
        padding: 3px 8px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 3px;
        cursor: pointer;
      }
      #toolbar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #toolbar .sep {
        width: 1px;
        align-self: stretch;
        background: var(--border);
        margin: 0 2px;
      }
      #toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      #canvas-scroll {
        flex: 1;
        overflow: auto;
        background: #fafafa;
      }
      #canvas {
        display: block;
      }
      #statusbar {
        display: flex;
        gap: 16px;
        padding: 3px 10px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      #status-diag {
        color: #b45309;
      }
      #status-file {
        margin-left: auto;
      }

      /* --- SvgRenderer / CellRenderer / JoinRenderer が出すクラス --- */
      .cell-rect {
        fill: #ffffff;
        stroke: #333333;
        stroke-width: 1;
      }
      .cell-rect.readonly {
        fill: #f0f0f0;
        stroke: #999999;
      }
      .cell-rect.unresolved {
        stroke: #d29922;
        stroke-dasharray: 3 2;
      }
      .cell-label {
        font-size: 11px;
        fill: #111111;
      }
      .celltype-label {
        font-size: 9px;
        fill: #666666;
      }
      .port-symbol {
        stroke: #333333;
        stroke-width: 0.75;
      }
      .port-symbol-cport {
        fill: #ffffff;
      }
      .port-symbol-eport {
        fill: #333333;
      }
      .join-line {
        stroke: #444444;
        stroke-width: 1.25;
      }
      .signature-label {
        font-size: 9px;
        fill: #555555;
      }
      .grid-line {
        stroke: #e2e2e2;
        stroke-width: 0.5;
      }
      .selection-outline {
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-dasharray: 4 2;
      }
      .selection-outline.join-selected {
        stroke-width: 2.5;
      }
      .join-preview {
        stroke: var(--accent);
        stroke-width: 1.5;
        stroke-dasharray: 5 3;
      }
      .rubber-band {
        stroke: var(--accent);
        stroke-width: 1;
        stroke-dasharray: 3 2;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button data-action="open" type="button">開く</button>
        <button data-action="save" type="button">保存</button>
        <button data-action="saveAs" type="button">名前を付けて保存</button>
        <span class="sep"></span>
        <button data-action="undo" type="button">元に戻す</button>
        <button data-action="redo" type="button">やり直し</button>
        <span class="sep"></span>
        <button data-action="zoomOut" type="button">−</button>
        <button data-action="zoomReset" type="button">100%</button>
        <button data-action="zoomIn" type="button">＋</button>
        <button data-action="toggleGrid" type="button">グリッド</button>
        <span class="sep"></span>
        <label><input type="checkbox" id="mode-newcell" /> セル新規</label>
        <select id="celltype-select"></select>
      </div>
      <div id="canvas-scroll">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" width="0" height="0"></svg>
      </div>
      <div id="statusbar">
        <span id="status-pos"></span>
        <span id="status-zoom"></span>
        <span id="status-diag"></span>
        <span id="status-file"></span>
      </div>
    </div>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
