name: Release

# TECSCDE-DT-EL 配布アーキテクチャ決定（2026-09-23、vault
# work/active/tecs/TECSCDE-DT-EL 配布アーキテクチャ決定.md）に基づく。
# `v*` タグのpushをトリガーに、Electron Forgeでpackage/makeし、
# origin自身（このリポジトリ）のGitHub Releasesへpublishする。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # OSごとに自分向けのMakerだけが走る（forge.config.js の platforms）。Windows: Squirrel、
    # macOS: DMG＋ZIP、Linux: DEB＋RPM。mac・Linuxのジョブは2026-10-28時点で未実行・未検証。
    strategy:
      # 1つのOSが失敗しても、ほかのOSの成果物は公開できるようにする。
      fail-fast: false
      # 各ジョブが同じタグのdraftリリースへ成果物を足す。同時に走ると、draftリリースが
      # 重複して作られる恐れがあるので、1つずつ順に走らせる。
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Gotchas - Electron Forge Packaging: @electron/packager はこのプロジェクトの
          # 既定Node（26系）で無期限にハングする。CI runnerでも同じ制約が及ぶため、
          # 動作確認済みのNode 22 LTSに明示的に固定する。
          node-version: "22"
          cache: "npm"

      # DEBの生成に fakeroot、RPMの生成に rpmbuild（パッケージ名は rpm）が要る。
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm

      - run: npm ci

      # テストは Windows 前提の記述が混じる可能性があるため、他OSでは走らせない
      # （他OSで通るかは未確認）。ビルドは prePackage が行う。
      - if: runner.os == 'Windows'
        run: npm run check

      - run: npx electron-forge publish
        env:
          # 同一リポジトリ（origin）へのリリース作成のみのため、既定のリポジトリ
          # スコープトークンで足りる。cross-repo用の個人アクセストークンは不要。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
