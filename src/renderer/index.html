<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- renderer は同一オリジンのバンドル1本とインラインスタイルのみ。外部リソース・
         eval・リモート接続は許可しない（第10章10.1節・Electron セキュリティ既定）。
         'wasm-unsafe-eval' は web-tree-sitter（CDL文法、2026-09-16移行）の
         WebAssembly.instantiate() 実行にのみ必要——通常のJS eval/Function()は
         引き続き禁止のまま（'unsafe-eval'とは異なる、Chromiumの狭いWASM専用許可）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'"
    />
    <title>TECSCDE</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #ffffff;
        --panel: #f3f3f3;
        --border: #cccccc;
        --ink: #222222;
        --accent: #1f6feb;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      #toolbar button {
        font: inherit;
        padding: 3px 8px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 3px;
        cursor: pointer;
      }
      #toolbar button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #toolbar .sep {
        width: 1px;
        align-self: stretch;
        background: var(--border);
        margin: 0 2px;
      }
      #display-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 3px 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        flex: none;
      }
      #toolbar[hidden], #palette[hidden], #property-panel[hidden], #statusbar[hidden], #file-browser[hidden] {
        display: none;
      }
      #panel-visibility { position: relative; flex: none; }
      #panel-visibility > summary {
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: #fff;
        cursor: pointer;
      }
      #panel-visibility-options {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 180px;
        padding: 8px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 3px;
        box-shadow: 0 2px 8px rgb(0 0 0 / 18%);
      }
      #panel-visibility:not([open]) #panel-visibility-options { display: none; }
      #region-filter {
        position: relative;
      }
      #region-filter-toggle {
        font: inherit;
        padding: 2px 8px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 3px;
        cursor: pointer;
      }
      #region-filter-toggle:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #region-filter-popover {
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 20;
        min-width: 220px;
        max-height: 320px;
        overflow: auto;
        padding: 6px 8px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 3px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }
      #region-filter-popover[hidden] {
        display: none;
      }
      .region-filter-row {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-top: 2px;
        padding-bottom: 2px;
      }
      .region-swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex: none;
      }
      #display-bar label {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      #zoom-slider {
        width: 100px;
      }
      #paper-select { font: inherit; }
      #paper-control { margin-left: auto; white-space: nowrap; }
      #toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      #search-box {
        position: relative;
      }
      #search-input {
        font: inherit;
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: 3px;
        width: 180px;
      }
      #search-count {
        color: #666666;
        min-width: 3em;
      }
      #main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #file-browser {
        flex: none;
        width: 180px;
        overflow-y: auto;
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 8px;
        font-size: 12px;
      }
      .file-browser-empty {
        color: #888888;
        font-size: 11px;
      }
      .file-browser-tree {
        list-style: none;
        margin: 0;
        padding-left: 12px;
      }
      #file-browser > .file-browser-tree {
        padding-left: 0;
      }
      .file-browser-dir,
      .file-browser-file {
        padding: 2px 4px;
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
      }
      .file-browser-dir:hover,
      .file-browser-file:hover {
        background: #e8e8e8;
      }
      .file-browser-file.active {
        background: var(--accent);
        color: #fff;
      }
      .file-browser-file.reference {
        background: #e6f0ff;
        font-style: italic;
      }
      #palette {
        flex: none;
        width: 160px;
        overflow-y: auto;
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 8px;
      }
      #palette-mode {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      #palette-mode button,
      .palette-celltype,
      .palette-celltype-details {
        font: inherit;
        padding: 3px 6px;
        border: 1px solid var(--border);
        background: #fff;
        border-radius: 3px;
        cursor: pointer;
        text-align: left;
      }
      .palette-celltype-row { display: flex; gap: 4px; align-items: stretch; }
      .palette-celltype-row .palette-celltype { flex: 1; min-width: 0; overflow-wrap: anywhere; }
      .palette-celltype-details { flex: none; padding: 3px; font-size: 11px; }
      #palette-mode button.active,
      .palette-celltype.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      #palette-celltypes {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .palette-empty {
        color: #888888;
        font-size: 11px;
      }
      #canvas-area {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      #canvas-scroll {
        position: absolute;
        inset: 0;
        overflow: auto;
        background: #fafafa;
        /* 2026-09-21: 用紙(#canvas)がビューポートより小さいとき（低〜中倍率で頻発）、
           overflow:autoの既定block整列だとSVGが左上に張り付き、scrollLeft/Topも
           スクロール範囲なしで常に0にクランプされる（pan-scroll.ts）。結果、
           ズームの固定点計算（view-state.ts zoomAt）は正しくてもカーソル位置ではなく
           常に画面左上を中心にズームしているように見えていた（実機対話確認で発見）。
           flex+safe centerは「収まる時は中央寄せ、はみ出す時は通常のスクロール開始位置
           （左上0）」を両立する標準的な手法——コンテンツが実際にビューポートを超える
           軸ではこれまで通りscrollLeft/Topの計算がそのまま機能する。 */
        display: flex;
        justify-content: safe center;
        align-items: safe center;
      }
      #canvas {
        display: block;
      }
      #region-legend {
        position: absolute;
        left: 8px;
        bottom: 8px;
        max-width: 260px;
        max-height: 40%;
        overflow: auto;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 3px;
        font-size: 11px;
      }
      #region-legend[hidden] {
        display: none;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 1px 0;
      }
      #navigator {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 140px;
        height: 100px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        border-radius: 3px;
      }
      #navigator svg {
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .navigator-paper {
        fill: #ffffff;
        stroke: #999999;
        stroke-width: 2;
      }
      .navigator-viewport {
        fill: rgba(31, 111, 235, 0.15);
        stroke: var(--accent);
        stroke-width: 2;
      }
      #property-panel {
        flex: none;
        width: 200px;
        overflow-y: auto;
        background: var(--panel);
        border-left: 1px solid var(--border);
        padding: 8px;
      }
      #property-panel h3 {
        margin: 0 0 8px;
        font-size: 12px;
      }
      .prop-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 6px;
      }
      .prop-field label {
        font-size: 10px;
        color: #666666;
      }
      .prop-field input, .prop-field select {
        font: inherit;
        padding: 2px 4px;
        border: 1px solid var(--border);
        border-radius: 3px;
      }
      .prop-field input:read-only {
        background: #eeeeee;
        color: #666666;
      }
      .prop-note,
      .prop-readonly {
        color: #888888;
        font-size: 11px;
        margin-bottom: 6px;
      }
      .prop-readonly-note {
        color: #b45309;
        font-size: 11px;
        margin-bottom: 6px;
      }
      #search-results {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        max-height: 200px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid var(--border);
        z-index: 1;
      }
      #search-results:empty {
        display: none;
      }
      .search-hit {
        padding: 3px 8px;
        font-size: 11px;
        cursor: pointer;
      }
      .search-hit:hover {
        background: #eeeeee;
      }
      .search-hit.current {
        background: var(--accent);
        color: #fff;
      }
      .search-hit.revealed {
        font-style: italic;
      }
      #statusbar {
        position: relative;
        display: flex;
        gap: 16px;
        padding: 3px 10px;
        background: var(--panel);
        border-top: 1px solid var(--border);
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      #status-message {
        color: #b45309;
      }
      #status-diag {
        font: inherit;
        font-weight: bold;
        color: #b45309;
        background: #fef3c7;
        border: 1px solid #b45309;
        border-radius: 3px;
        padding: 1px 6px;
        cursor: pointer;
      }
      #status-diag:empty {
        background: none;
        border: none;
        padding: 0;
      }
      #status-diag:disabled {
        cursor: default;
      }
      #status-file {
        margin-left: auto;
      }
      #status-file.dirty {
        font-weight: bold;
        color: #b45309;
      }
      #export-dialog[hidden] { display: none; }
      #export-dialog {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: rgb(0 0 0 / 35%);
      }
      #export-dialog-panel {
        min-width: 300px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        box-shadow: 0 8px 24px rgb(0 0 0 / 20%);
      }
      #export-dialog-panel h2 { margin: 0 0 12px; font-size: 15px; }
      #export-dialog-panel label { display: flex; gap: 12px; align-items: center; }
      #export-dialog-panel label + label { margin-top: 8px; }
      #png-scale-field[hidden] { display: none; }
      #export-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      #celltype-details-dialog {
        width: 640px;
        max-width: calc(100vw - 32px);
        max-height: calc(100vh - 40px);
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--ink);
        overflow: auto;
      }
      #celltype-details-dialog:not([open]) { display: none; }
      #celltype-details-dialog::backdrop { background: rgb(0 0 0 / 35%); }
      #celltype-details-dialog h2 { margin: 0 0 12px; font-size: 17px; }
      #celltype-details-dialog h3 { margin: 16px 0 6px; font-size: 14px; }
      #celltype-details-dialog dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; }
      #celltype-details-dialog dd { margin: 0; overflow-wrap: anywhere; }
      #celltype-details-dialog table { width: 100%; border-collapse: collapse; }
      #celltype-details-dialog th, #celltype-details-dialog td {
        padding: 4px 6px;
        border: 1px solid var(--border);
        text-align: left;
        overflow-wrap: anywhere;
      }
      #celltype-details-dialog .celltype-details-close { display: block; margin: 16px 0 0 auto; font: inherit; }
      #diagnostics-panel {
        position: absolute;
        bottom: 100%;
        left: 0;
        right: 0;
        max-height: 240px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid var(--border);
        border-bottom: none;
        z-index: 1;
      }
      .diag-item {
        padding: 4px 10px;
        font-size: 11px;
        border-bottom: 1px solid var(--border);
      }
      .diag-error {
        color: #b91c1c;
      }
      .diag-warning {
        color: #b45309;
      }
      .diag-jumpable {
        cursor: pointer;
      }
      .diag-jumpable:hover {
        background: #eeeeee;
      }

    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button data-action="openFolder" type="button" title="ファイルブラウザのルートフォルダを選ぶ（外部仕様3.5.1節）">フォルダを開く</button>
        <button data-action="save" type="button">保存</button>
        <button data-action="saveAs" type="button">名前を付けて保存</button>
        <button data-action="exportDiagram" type="button">エクスポート</button>
        <button data-action="clear" type="button" title="編集対象をクリアし、新規作成する（外部仕様5.2節）">消去</button>
        <span class="sep"></span>
        <button data-action="undo" type="button">元に戻す</button>
        <button data-action="redo" type="button">やり直し</button>
        <button data-action="alignTop" type="button" title="選択したセルの上端を、最初に選んだセルにそろえる（外部仕様7.3.2）">上端をそろえる</button>
        <button data-action="alignLeft" type="button" title="選択したセルの左端を、最初に選んだセルにそろえる（外部仕様7.3.2）">左端をそろえる</button>
        <span class="sep"></span>
        <button data-action="zoomReset" type="button">Reset Rate</button>
        <input id="zoom-slider" type="range" min="5" max="200" step="1" value="100" title="表示倍率（外部仕様3.2.1: 5%〜200%、既定100%）" />
        <button data-action="toggleGrid" type="button">グリッド</button>
        <button data-action="toggleNavigator" type="button">ナビゲータ</button>
        <span class="sep"></span>
        <button data-action="generate" type="button" title="tecsgenを実行する（第9章9.5節）">実行</button>
        <button data-action="copyTecsgenCommand" type="button" title="tecsgenのコマンドラインをコピーする（外部仕様8.4.2）">コマンドをコピー</button>
        <span class="sep"></span>
        <div id="search-box">
          <input type="search" id="search-input" placeholder="検索: セル名/セルタイプ/シグニチャ" />
          <span id="search-count"></span>
          <button data-action="searchPrev" type="button" title="前のヒットへ">↑</button>
          <button data-action="searchNext" type="button" title="次のヒットへ">↓</button>
          <div id="search-results"></div>
        </div>
      </div>
      <div id="display-bar">
        <details id="panel-visibility">
          <summary>表示</summary>
          <div id="panel-visibility-options">
            <label><input type="checkbox" data-panel="toolbar" aria-controls="toolbar" checked /> ツールバー</label>
            <label><input type="checkbox" data-panel="palette" aria-controls="palette" checked /> セルタイプ一覧</label>
            <label><input type="checkbox" data-panel="property-panel" aria-controls="property-panel" checked /> プロパティ</label>
            <label><input type="checkbox" data-panel="statusbar" aria-controls="statusbar" checked /> ステータス表示</label>
            <label><input type="checkbox" data-panel="file-browser" aria-controls="file-browser" checked /> ファイルブラウザ</label>
          </div>
        </details>
        <div id="region-filter">
          <button type="button" id="region-filter-toggle" aria-expanded="false" title="チェックを外したリージョンのセルを非表示にする（外部仕様7.5.2）">リージョン</button>
          <div id="region-filter-popover" hidden></div>
        </div>
        <label title="リージョンごとにセルの左端を色分けする（外部仕様7.5.2）"><input type="checkbox" id="filter-color" /> 色分け</label>
        <label title="結合のシグニチャ名ラベルを表示する（外部仕様7.5.2）"><input type="checkbox" id="filter-signature" /> シグニチャ名</label>
        <label title="セル名を大きく表示し、セルタイプ名を隠す（外部仕様7.4.2）"><input type="checkbox" id="filter-emphasize" /> セル名強調</label>
        <label id="paper-control">用紙
          <select id="paper-select" aria-label="用紙サイズと向き">
            <option value="A4:LANDSCAPE">A4 横</option>
            <option value="A4:PORTRAIT">A4 縦</option>
            <option value="A3:LANDSCAPE">A3 横</option>
            <option value="A3:PORTRAIT">A3 縦</option>
            <option value="A2:LANDSCAPE">A2 横</option>
            <option value="A2:PORTRAIT">A2 縦</option>
          </select>
        </label>
      </div>
      <div id="main">
        <div id="file-browser"></div>
        <div id="palette">
          <div id="palette-mode">
            <button data-mode="select" type="button">選択</button>
            <button data-mode="newCell" type="button">セル新規作成</button>
          </div>
          <div id="palette-celltypes"></div>
        </div>
        <div id="canvas-area">
          <div id="canvas-scroll">
            <svg id="canvas" xmlns="http://www.w3.org/2000/svg" width="0" height="0"></svg>
          </div>
          <div id="region-legend" hidden></div>
        <div id="navigator">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"></svg>
          </div>
        </div>
        <div id="property-panel"></div>
      </div>
      <div id="statusbar">
        <span id="status-pos"></span>
        <span id="status-zoom"></span>
        <span id="status-region"></span>
        <span id="status-message" role="status" aria-live="polite"></span>
        <button id="status-diag" type="button" title="診断一覧を表示/非表示"></button>
        <div id="diagnostics-panel" hidden></div>
        <span id="status-file"></span>
      </div>
    </div>
    <div id="export-dialog" role="dialog" aria-modal="true" aria-labelledby="export-dialog-title" hidden>
      <div id="export-dialog-panel">
        <h2 id="export-dialog-title">図のエクスポート</h2>
        <label>形式
          <select id="export-format">
            <option value="svg">SVG</option>
            <option value="png">PNG</option>
            <option value="pdf">PDF</option>
          </select>
        </label>
        <label>出力範囲
          <select id="export-range">
            <option value="paper">用紙に合わせる</option>
            <option value="content">図の内容に合わせる</option>
          </select>
        </label>
        <label id="png-scale-field" hidden>PNG倍率
          <select id="png-scale">
            <option value="1">1×</option>
            <option value="2" selected>2×</option>
            <option value="4">4×</option>
          </select>
        </label>
        <div id="export-dialog-actions">
          <button id="export-cancel" type="button">キャンセル</button>
          <button id="export-confirm" type="button">保存先を選ぶ</button>
        </div>
      </div>
    </div>
    <dialog id="celltype-details-dialog" aria-labelledby="celltype-details-title">
      <h2 id="celltype-details-title">セルタイプの詳細</h2>
      <div class="celltype-details-content"></div>
      <button class="celltype-details-close" type="button">閉じる</button>
    </dialog>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
